<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>콩콩 파티게임</title>
<meta name="theme-color" content="#0c1022">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="콩콩 파티게임">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 한밤의 연회장: 짙은 남색 바탕, 샴페인 골드 포인트, 보석색 팀 컬러. 홈은 번호가 붙은 게임 목록, 진행 화면은 무대 하나에 집중 */
:root{
  color-scheme:dark;
  --bg:#0c1022; --bg2:#141a36; --panel:#181f40; --line:#2b3463;
  --ink:#f5efe2; --muted:#9aa2c7; --gold:#d8b46a; --gold2:#f1dba8;
  --t1:#d8546b; --t2:#4f8fe6; --t3:#3fbf8f; --t4:#e5a43a; --t5:#a77be6; --t6:#e0785a;
  --display:'Noto Serif KR','Nanum Myeongjo',serif; --body:'Noto Sans KR','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--body);background:var(--bg);color:var(--ink);overflow-x:hidden;
  background-image:radial-gradient(1200px 600px at 80% -10%,#26306a55,transparent 60%),radial-gradient(900px 500px at -10% 110%,#5a3d1a33,transparent 60%)}
button{font-family:inherit;cursor:pointer;border:0;color:inherit;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.screen{display:none;min-height:100%;padding:28px clamp(16px,4vw,48px) 40px;flex-direction:column;gap:20px}
.screen.on{display:flex}
h1,h2,h3{font-family:var(--display);text-wrap:balance}
/* 홈 */
.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:18px}
.mast h1{font-size:clamp(34px,5vw,60px);font-weight:900;letter-spacing:.02em}
.mast h1 em{font-style:normal;color:var(--gold)}
.mast p{color:var(--muted);font-size:16px;margin-top:6px}
.setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.box h3{font-size:15px;color:var(--gold);letter-spacing:.12em;margin-bottom:12px;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:7px 15px;font-size:15px;transition:.15s}
.pill:hover{border-color:var(--gold);color:var(--ink)}
.pill.sel{background:var(--gold);border-color:var(--gold);color:#1a1405;font-weight:700}
.team-in{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.team-in i{width:12px;height:12px;border-radius:50%}
.team-in input{background:transparent;border:0;color:var(--ink);font-size:16px;width:104px;font-family:inherit}
.sect{display:flex;align-items:baseline;gap:14px;margin-top:8px}
.sect h2{font-size:24px;font-weight:700}
.sect span{color:var(--muted);font-size:14px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.game{position:relative;text-align:left;background:linear-gradient(160deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;transition:.2s;display:flex;flex-direction:column;gap:6px;min-height:118px}
.game:hover{border-color:var(--gold);transform:translateY(-3px);box-shadow:0 14px 30px #0008}
.game .no{font-family:var(--display);color:var(--gold);font-size:14px;letter-spacing:.1em}
.game .nm{font-family:var(--display);font-size:23px;font-weight:700}
.game .ds{color:var(--muted);font-size:13.5px;line-height:1.45}
.game .left{margin-top:auto;font-size:12.5px;color:var(--gold);opacity:.85}
.ghost{border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:15px;color:var(--muted)}
.ghost:hover{color:var(--ink);border-color:var(--gold)}
/* 진행 화면 공통 */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h2{font-size:26px;color:var(--gold2);font-weight:700}
.top .prog{margin-left:auto;color:var(--muted);font-size:17px;font-variant-numeric:tabular-nums}
.board{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.box .board{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.tb{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:12px;padding:8px 10px 8px 14px;transition:transform .2s}
.tb.bump{transform:scale(1.12)}
.tb .nm{font-size:16px;font-weight:500}
.tb .sc{font-family:var(--display);font-weight:900;font-size:clamp(22px,2.4vw,30px);min-width:40px;text-align:center;color:var(--c);font-variant-numeric:tabular-nums}
.tb button{border:1px solid var(--line);border-radius:8px;width:32px;height:32px;font-size:19px;color:var(--muted)}
.tb button:hover{border-color:var(--c);color:var(--ink)}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;min-height:300px}
.timer{position:relative;width:92px;height:92px;flex:none}
.timer svg{transform:rotate(-90deg)}
.timer .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;font-size:32px;font-variant-numeric:tabular-nums}
.timer.low .t{color:var(--t1)}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 16px;color:var(--gold2);font-size:16px}
.flag{width:min(80vw,440px,55vh);border-radius:6px;overflow:hidden;box-shadow:0 0 0 6px #fff1,0 20px 50px #000a;background:#fff}
.flag svg,.flag img{display:block;width:100%}
.cho{font-family:var(--display);font-weight:900;font-size:clamp(48px,11vw,150px);letter-spacing:.14em;line-height:1.25;max-width:94vw;word-break:keep-all}
.cho.long{font-size:clamp(30px,5.6vw,76px);letter-spacing:.08em;word-spacing:.45em}
.qtext{font-family:var(--display);font-weight:700;font-size:clamp(28px,4.6vw,58px);line-height:1.4;max-width:1000px;word-break:keep-all}
.emo{font-size:clamp(64px,12vw,150px);letter-spacing:.1em}
.hints{display:flex;flex-direction:column;gap:12px;width:min(92vw,760px)}
.hints div{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:10px;padding:14px 20px;font-size:clamp(19px,2.6vw,28px);text-align:left;display:flex;gap:14px}
.hints div b{font-family:var(--display);color:var(--gold)}
.zoom{width:min(70vw,340px,46vh);aspect-ratio:1;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 50px #000a}
.zoom>*{transition:transform .7s cubic-bezier(.2,.8,.2,1),filter .7s}
.zoom span{font-size:min(50vw,240px,32vh);line-height:1}
.zoom img{width:100%;height:100%;object-fit:contain}
.photo{width:min(86vw,720px);height:min(52vh,480px);aspect-ratio:auto;background:#000}
.bal{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:stretch;width:min(94vw,1000px)}
.bal button{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:34px 20px;font-family:var(--display);font-weight:700;font-size:clamp(24px,3.6vw,44px);line-height:1.35;word-break:keep-all;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center}
.bal button:nth-child(1){border-top:4px solid var(--t1)} .bal button:nth-child(3){border-top:4px solid var(--t2)}
.bal button small{font-family:var(--body);font-size:18px;color:var(--muted);font-weight:400}
.bal .vs{align-self:center;font-family:var(--display);color:var(--gold);font-size:28px}
.answer{font-family:var(--display);font-weight:900;font-size:clamp(34px,6vw,72px);color:var(--gold);min-height:1.3em;opacity:0;transform:translateY(12px);transition:.35s;word-break:keep-all;max-width:94vw}
.answer.show{opacity:1;transform:none}
.answer small{display:block;font-family:var(--body);font-weight:400;font-size:clamp(15px,2vw,20px);color:var(--muted);margin-top:6px}
.ctrl{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{border-radius:12px;padding:13px 26px;font-size:19px;font-weight:700;border:1px solid var(--line);background:var(--panel);transition:.15s}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1405;border-color:var(--gold)}
.btn.c1{border-color:var(--t1)} .btn.c2{border-color:var(--t2)} .btn.c3{border-color:var(--t3)} .btn.c4{border-color:var(--t4)} .btn.c5{border-color:var(--t5)} .btn.c6{border-color:var(--t6)}
.keys{color:var(--muted);font-size:13px;text-align:center}
/* 카드 게임 */
.card{background:linear-gradient(160deg,#fbf6e9,#eadfc4);color:#1c1608;border-radius:20px;width:min(90vw,760px);min-height:230px;display:flex;align-items:center;justify-content:center;padding:30px;font-family:var(--display);font-weight:900;font-size:clamp(40px,8vw,104px);box-shadow:0 30px 60px #000a;word-break:keep-all;line-height:1.25}
.card.sm{font-size:clamp(24px,3.8vw,46px);color:#3d3113;line-height:1.5}
/* 음악 패널 */
.mgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;width:min(96vw,1100px);margin:0 auto}
.mgrid .hd{font-family:var(--display);color:var(--gold2);text-align:center;font-size:clamp(14px,1.7vw,20px);padding:6px 2px;word-break:keep-all}
.mcell{aspect-ratio:1.5;border-radius:12px;border:1px solid var(--gold);background:linear-gradient(160deg,var(--panel),var(--bg2));font-family:var(--display);font-weight:900;font-size:clamp(24px,4vw,48px);color:var(--gold)}
.mcell:hover{background:var(--gold);color:#1a1405}
.mcell.done{border-color:var(--line);color:var(--muted);font-size:16px;font-family:var(--body);font-weight:500;background:var(--bg2);cursor:default}
/* 오버레이 */
.ov{position:fixed;inset:0;background:#070a18e6;display:none;align-items:center;justify-content:center;z-index:30;padding:20px}
.ov.on{display:flex}
.dlg{background:var(--panel);border:1px solid var(--gold);border-radius:18px;padding:28px;width:min(94vw,720px);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:18px;text-align:center}
.dlg h2{font-size:28px;color:var(--gold2)}
.dlg p{color:var(--muted);line-height:1.6}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.opts button{border:1px solid var(--line);border-radius:12px;padding:16px 10px;font-size:18px;font-weight:500}
.opts button:hover{border-color:var(--gold)}
.opts button small{display:block;color:var(--muted);font-size:13px;margin-top:4px}
/* 도구 */
.rules{max-width:720px;color:var(--muted);line-height:1.7;font-size:17px}
.bigno{font-family:var(--display);font-weight:900;font-size:clamp(80px,16vw,200px);line-height:1;font-variant-numeric:tabular-nums}
.coin{width:190px;height:190px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--gold2),var(--gold) 60%,#8c6a2a);color:#3a2a08;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;font-size:64px;box-shadow:0 20px 40px #000a,inset 0 0 0 8px #fff3}
.coin.flip{animation:flip 1s ease-out}
@keyframes flip{from{transform:rotateX(0) translateY(0)}50%{transform:rotateX(900deg) translateY(-90px)}to{transform:rotateX(1800deg)}}
.nums{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;width:min(92vw,620px)}
.nums i{font-style:normal;border:1px solid var(--line);border-radius:8px;padding:6px 0;color:var(--muted);font-variant-numeric:tabular-nums}
.nums i.on{background:var(--gold);color:#1a1405;border-color:var(--gold);font-weight:700}
#toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-30px);opacity:0;background:var(--panel);border:1px solid var(--gold);color:var(--gold2);border-radius:12px;padding:10px 18px;z-index:60;transition:.3s;font-size:15px;max-width:92vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
canvas#conf{position:fixed;inset:0;pointer-events:none;z-index:50}
.fs{position:fixed;right:14px;bottom:12px;z-index:40;font-size:13px}
.winner{font-family:var(--display);font-weight:900;font-size:clamp(40px,8vw,96px);color:var(--gold)}
.rank{width:min(92vw,520px);display:flex;flex-direction:column;gap:10px}
.rank div{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:14px 20px;font-size:22px}
.rank b{font-family:var(--display);color:var(--c)}
@media (max-width:560px){.bal{grid-template-columns:1fr}.mgrid{gap:6px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="conf"></canvas>
<button class="ghost fs" id="fsBtn">전체화면</button>

<section class="screen on" id="home">
  <header class="mast">
    <div><h1><em>콩콩</em> 파티게임</h1><p id="lead"></p></div>
    <div class="row"><button class="ghost" id="usedBtn">문제 기록 초기화</button><button class="ghost" id="resetBtn">점수 초기화</button></div>
  </header>
  <div class="setup">
    <div class="box"><h3>팀</h3><div class="row" id="teamCount" style="margin-bottom:10px"></div><div class="row" id="teamInputs"></div></div>
    <div class="box"><h3>제한 시간</h3><div class="row" id="timeOpts"></div><h3 style="margin-top:16px">문제 수</h3><div class="row" id="numOpts"></div></div>
    <div class="box"><h3>현재 점수</h3><div class="board"></div></div>
  </div>
  <div class="sect"><h2>퀴즈</h2><span>점수는 게임을 바꿔도 이어집니다</span></div>
  <div class="games" id="games"></div>
  <div class="sect"><h2>팀 도전</h2><span>한 팀씩 나와 제한 시간 동안 도전합니다</span></div>
  <div class="games" id="team"></div>
  <div class="sect"><h2>몸으로 하는 게임</h2><span>규칙 안내와 타이머, 추첨 도구</span></div>
  <div class="games" id="tools"></div>
</section>

<section class="screen" id="quiz">
  <div class="top"><button class="ghost" data-home>처음으로</button><h2 id="qTitle"></h2><div class="prog" id="qNum"></div></div>
  <div class="board"></div>
  <div class="stage">
    <div class="timer" id="timer"><svg width="92" height="92"><circle cx="46" cy="46" r="40" stroke="#2b3463" stroke-width="7" fill="none"/><circle id="ring" cx="46" cy="46" r="40" stroke="#d8b46a" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="251.3"/></svg><div class="t" id="tNum"></div></div>
    <div id="qBody" style="display:flex;flex-direction:column;align-items:center;gap:16px"></div>
    <div class="answer" id="answer"></div>
  </div>
  <div class="ctrl"><button class="btn" id="hintBtn">힌트</button><button class="btn" id="revealBtn">정답 보기</button><button class="btn gold" id="nextBtn">다음 문제</button></div>
  <div class="keys">스페이스바: 정답 보기, 다음 문제 · 숫자키 1~6: 해당 팀 +1점 · H: 힌트</div>
</section>

<section class="screen" id="cards">
  <div class="top"><button class="ghost" data-home>처음으로</button><h2 id="cTitle"></h2><div class="prog" id="cInfo"></div></div>
  <div class="board"></div>
  <div class="stage" id="cStage"></div>
</section>

<section class="screen" id="music">
  <div class="top"><button class="ghost" data-home>처음으로</button><h2>음악 퀴즈</h2><div class="prog">노래는 진행자가 휴대폰이나 스피커로 직접 틀어 주세요</div></div>
  <div class="board"></div>
  <div class="stage"><div class="mgrid" id="mgrid"></div><button class="ghost" id="mReset">패널 다시 채우기</button></div>
</section>

<section class="screen" id="tool">
  <div class="top"><button class="ghost" data-home>처음으로</button><h2 id="tTitle"></h2></div>
  <div class="board"></div>
  <div class="stage" id="tStage"></div>
</section>

<section class="screen" id="result">
  <div class="stage"><p class="chip">최종 결과</p><div class="winner" id="winner"></div><div class="rank" id="rank"></div>
  <div class="ctrl"><button class="btn gold" data-home>다른 게임 하기</button></div></div>
</section>

<div class="ov" id="ov"><div class="dlg" id="dlg"></div></div>

/* 이미 나온 문제 기록: 이 브라우저에 저장되어 모든 문제를 한 번씩 다 풀기 전에는 같은 문제가 다시 나오지 않아요 */
let USED={};try{USED=JSON.parse(localStorage.getItem('kongkong_used')||'{}')||{}}catch(e){USED={}}
const keyOf=q=>typeof q==='string'?q:[q.a,q.q,q.e,q.x].filter(Boolean).join('|');
function saveUsed(){try{localStorage.setItem('kongkong_used',JSON.stringify(USED))}catch(e){}}
function markUsed(gid,q){if(!gid)return;const k=keyOf(q);USED[gid]=USED[gid]||[];if(!USED[gid].includes(k)){USED[gid].push(k);saveUsed()}}
function leftCount(gid,data){const u=new Set(USED[gid]||[]);return data.filter(q=>!u.has(keyOf(q))).length}
function pickFresh(gid,data,n){
  const u=new Set(USED[gid]||[]);let fresh=shuffle(data.filter(q=>!u.has(keyOf(q))));
  const want=n||data.length;
  if(fresh.length>=want||!gid)return {list:fresh.slice(0,want),note:''};
  if(!fresh.length){USED[gid]=[];saveUsed();return {list:shuffle(data).slice(0,want),note:'모든 문제를 한 번씩 풀었어요. 처음부터 다시 섞었습니다'}}
  const used=shuffle(data.filter(q=>u.has(keyOf(q))));const fill=used.slice(0,want-fresh.length);
  USED[gid]=used.slice(want-fresh.length).map(keyOf);saveUsed();
  return {list:[...fresh,...fill],note:`남은 새 문제 ${fresh.length}개를 먼저 내고, 이어서 이전 문제를 섞었어요`};
}
function toast(msg){if(!msg)return;let d=$('toast');if(!d){d=el('div','');d.id='toast';document.body.appendChild(d)}d.textContent=msg;d.className='on';clearTimeout(d._t);d._t=setTimeout(()=>d.className='',4200)}

/* 소리 */
let actx=null;
function beep(f=660,d=.12,type='sine',v=.18,when=0){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;const t=actx.currentTime+when;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d)}catch(e){}}
const ding=()=>{beep(880,.15);beep(1320,.3,'sine',.18,.12)},buzz=()=>beep(170,.6,'sawtooth',.13),pop=()=>beep(990,.07,'triangle',.2);

/* 점수판 */
function renderBoards(bump=-1){
  document.querySelectorAll('.board').forEach(b=>{b.innerHTML='';
    for(let i=0;i<nTeams;i++){const d=el('div','tb'+(i===bump?' bump':''));d.style.setProperty('--c',TC[i]);

      d.querySelectorAll('button').forEach(x=>x.onclick=()=>addScore(i,+x.dataset.d));b.appendChild(d)}});
  if(bump>=0)setTimeout(()=>renderBoards(),220);
}
function addScore(i,d){if(i>=nTeams)return;scores[i]=Math.max(0,scores[i]+d);if(d>0)ding();renderBoards(d>0?i:-1)}

  tInt=setInterval(()=>{tLeft--;drawT();if(tLeft<=3&&tLeft>0)beep(520,.1,'square',.1);if(tLeft<=0){stopTimer();buzz();if(onTimeUp)onTimeUp()}},1000)}

function drawT(){const n=$('tNum');if(!n)return;n.textContent=tLeft<=0?'끝':tLeft;const f=Math.max(0,tLeft/tTotal);

function startQA(gm,data,label){
  game=gm;const track=gm.gen||gm.kind==='photo'?'':gm.id;const pf=pickFresh(track,data,numQ);list=pf.list;toast(pf.note);idx=0;
  $('qTitle').textContent=gm.name+(label?' · '+label:'');show('quiz');renderBoards();loadQ();pop();
}
const ZL=[7,4,2.2,1],BL=[26,13,5,0];
function matchSVG(eq,color){
  const seg={a:[12,6,48,6],b:[54,12,54,54],c:[54,66,54,108],d:[12,114,48,114],e:[6,66,6,108],f:[6,12,6,54],g:[12,60,48,60]};
  const D={0:'abcdef',1:'bc',2:'abdeg',3:'abcdg',4:'bcfg',5:'acdfg',6:'acdefg',7:'abc',8:'abcdefg',9:'abcdfg'};
  let x=0,out='';const stick=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color||'#e9cf9a'}" stroke-width="7" stroke-linecap="round"/><circle cx="${x1}" cy="${y1}" r="5.5" fill="#c8402f"/>`;
  for(const ch of eq){let s=[];
    if(D[ch]!=null)s=[...D[ch]].map(k=>seg[k]);else if(ch==='+')s=[[10,60,50,60],[30,38,30,82]];else if(ch==='-')s=[[10,60,50,60]];else if(ch==='=')s=[[10,46,50,46],[10,74,50,74]];
    out+=`<g transform="translate(${x},0)">${s.map(p=>stick(...p)).join('')}</g>`;x+=84}
  return `<svg viewBox="-8 -6 ${x} 132" style="width:min(88vw,${x*1.5}px);display:block" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${eq}">${out}</svg>`;
}
function loadQ(){
  revealed=false;step=0;const q=list[idx],k=game.kind;$('hintBtn').textContent='힌트';if(!game.gen&&k!=='photo')markUsed(game.id,q);
  $('qNum').textContent=`${idx+1} / ${list.length}`;
  const A=$('answer');A.classList.remove('show');A.innerHTML='';
  $('nextBtn').textContent=idx===list.length-1?'결과 보기':'다음 문제';
  $('hintBtn').style.display=k==='balance'?'none':'';$('revealBtn').style.display=k==='balance'?'none':'';
  let h='';
  if(k==='flag')h=`<div class="flag">${q.svg||`<img src="${q.img}" alt="국기">`}</div>`;
  if(k==='chosung'){const c=cho(q.a);h=`<span class="chip">${q.c}</span><div class="cho${c.length>7?' long':''}">${c}</div>`}
  if(k==='text'){const ox=q.q.startsWith('OX:');h=`${ox?'<span class="chip">O일까요, X일까요?</span>':''}<div class="qtext">${esc(ox?q.q.slice(3).trim():q.q)}</div>`}
  if(k==='scramble'){if(!q.s){const cs=[...q.a.replace(/ /g,'')];let s;do{s=shuffle(cs).join('')}while(s===cs.join(''));q.s=s}h=`<span class="chip">글자 순서를 바로잡아 보세요</span><div class="cho${q.s.length>7?' long':''}">${q.s}</div>`}
  if(k==='hints')h=`<div class="hints" id="hintBox"></div>`;
  if(k==='emoji')h=`<div class="emo">${q.e}</div>`;
  if(k==='zoom'){const ox=25+(idx*37)%50,oy=25+(idx*53)%50;h=`<div class="zoom"><span id="zi" style="transform-origin:${ox}% ${oy}%">${q.e}</span></div>`}
  if(k==='photo'){h=`<div class="zoom photo"><img id="zi" src="${q.img}" alt="문제 사진" style="transform-origin:${30+(idx*37)%40}% ${30+(idx*53)%40}%"></div>`}
  if(k==='match')h=`<span class="chip">성냥개비 하나만 옮겨서 식을 맞게 고쳐 보세요</span>${matchSVG(q.q)}`;
  if(k==='balance'){q.v=q.v||[0,0];h=`<div class="bal"><button id="bA">${esc(q.x)}<small id="vA"></small></button><span class="vs">VS</span><button id="bB">${esc(q.y)}<small id="vB"></small></button></div><p class="keys">고른 쪽을 누르면 표가 올라가요</p>`}
  $('qBody').innerHTML=h;
  if(k==='hints')drawHints();
  if(k==='zoom'||k==='photo')drawZoom();
  if(k==='balance'){revealed=true;const dv=()=>{$('vA').textContent=q.v[0]+'표';$('vB').textContent=q.v[1]+'표'};dv();$('bA').onclick=()=>{q.v[0]++;pop();dv()};$('bB').onclick=()=>{q.v[1]++;pop();dv()}}
  startTimer(k==='balance'?0:timeLimit);
}
function drawHints(){const q=list[idx];$('hintBox').innerHTML=q.h.slice(0,step+1).map((t,i)=>`<div><b>힌트 ${i+1}</b><span>${esc(t)}</span></div>`).join('');
  $('hintBtn').textContent=step<q.h.length-1?'다음 힌트':'힌트 끝'}
function drawZoom(){const z=$('zi');if(!z)return;const q=list[idx],m=q.mode||'zoom',s=revealed?3:Math.min(step,3);
  z.style.transform=m==='zoom'?`scale(${ZL[s]})`:'none';z.style.filter=m==='blur'?`blur(${BL[s]}px)`:'none';
  $('hintBtn').textContent=m==='plain'?'힌트':(m==='blur'?'조금 더 선명하게':'조금 멀리서 보기')}
function partial(t){const A=$('answer');A.innerHTML=t;A.classList.add('show')}
function hint(){
  if(revealed)return;const q=list[idx],k=game.kind;pop();
  if(k==='hints'){if(step<q.h.length-1){step++;drawHints()}return}
  if(k==='zoom'||(k==='photo'&&q.mode!=='plain')){if(step<2){step++;drawZoom()}else if(q.a)partial(cho(q.a));return}
  if(k==='chosung'){partial(q.a[0]+cho(q.a.slice(1)));return}
  if(k==='flag'||k==='scramble'){partial(q.a[0]+'○'.repeat(q.a.length-1));return}
  if(k==='match'){const d=[...q.q].map((c,i)=>c!==q.a[i]?['첫째 숫자','가운데 부호','둘째 숫자','','답']['01234'.indexOf(i)]:'').filter(Boolean);partial(`<small>바뀌는 곳: ${d.join(', ')}</small>`);return}
  if(k==='text'&&q.q.startsWith('OX:'))return;
  if(q.a)partial(cho(q.a));
}
function reveal(){
  if(revealed)return;revealed=true;stopTimer();const q=list[idx],k=game.kind,A=$('answer');
  if(k==='hints'){step=q.h.length-1;drawHints()}
  if(k==='zoom'||k==='photo')drawZoom();
  A.innerHTML=k==='match'?matchSVG(q.a,'#f1dba8'):(esc(q.a||'정답은 진행자가 알려 주세요')+(q.n?`<small>${esc(q.n)}</small>`:''));
  A.classList.remove('show');void A.offsetWidth;A.classList.add('show');ding();confetti(30);
}
function next(){if(!revealed){reveal();return}if(idx<list.length-1){idx++;loadQ();pop()}else finish()}
function finish(){
  stopTimer();show('result');const order=[...Array(nTeams).keys()].sort((a,b)=>scores[b]-scores[a]);
  const top=scores[order[0]],win=order.filter(i=>scores[i]===top);
  $('winner').textContent=win.length>1?'공동 우승':`${teamNames[win[0]]} 우승`;
  $('rank').innerHTML=order.map((i,k)=>`<div style="--c:${TC[i]}"><span>${k+1}위 · ${esc(teamNames[i])}</span><b>${scores[i]}점</b></div>`).join('');
  [0,300,600].forEach(t=>setTimeout(()=>confetti(110),t));[523,659,784,1047].forEach((f,k)=>beep(f,.25,'triangle',.18,k*.15));
}

function musicCell(key,cat,p){pop();
  openDlg(`<p class="chip" style="align-self:center">${cat} · ${p}점</p><h2>노래를 틀어 주세요</h2><p>${p===1?'쉬운 곡':p===2?'보통 난이도의 곡':'어려운 곡'}을 골라 틀어 주세요. 먼저 제목을 맞힌 팀을 누르면 점수가 올라갑니다.</p><div class="ctrl" id="mTeams"></div><button class="ghost" id="mNone">아무도 못 맞힘</button><button class="ghost" id="dlgX">취소</button>`);
  for(let i=0;i<nTeams;i++){const b=el('button','btn c'+(i+1),esc(teamNames[i]));b.onclick=()=>{mDone[key]=teamNames[i];addScore(i,p);confetti(40);closeDlg();drawMusic()};$('mTeams').appendChild(b)}
  $('mNone').onclick=()=>{mDone[key]='통과';closeDlg();drawMusic()};$('dlgX').onclick=closeDlg}

/* ================= 내 사진 퀴즈 ================= */
let pMode='zoom';
function openPhoto(){
  openDlg(`<h2>포스터·내 사진 퀴즈</h2><p>컴퓨터에 있는 포스터, 인물, 명장면 사진을 여러 장 골라 주세요. 파일 이름이 정답으로 쓰입니다. 예: 겨울왕국.jpg<br>사진은 이 컴퓨터 안에서만 쓰이고 어디에도 올라가지 않습니다.</p>
  <div class="row" id="pModes" style="justify-content:center"></div><input type="file" id="pFiles" accept="image/*" multiple style="display:none"><button class="btn gold" id="pPick">사진 고르기</button><button class="ghost" id="dlgX">닫기</button>`);
  const pm=$('pModes');[['plain','그대로 보여 주기'],['zoom','확대해서 시작'],['blur','흐리게 시작']].forEach(([v,t])=>{const b=el('button','pill'+(v===pMode?' sel':''),t);b.onclick=()=>{pMode=v;openPhoto()};pm.appendChild(b)});
  $('pPick').onclick=()=>$('pFiles').click();$('dlgX').onclick=closeDlg;
  $('pFiles').onchange=e=>{const fs=[...e.target.files].filter(f=>f.type.startsWith('image/'));if(!fs.length)return;
    const data=fs.map(f=>({img:URL.createObjectURL(f),a:f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').trim(),mode:pMode}));
    closeDlg();startQA({name:'내 사진 퀴즈',kind:'photo'},data)};
}

/* ================= 게임 도구 ================= */
let swInt=null;
function openTool(t){show('tool');$('tTitle').textContent=t.name;renderBoards();clearInterval(swInt);const st=$('tStage');st.innerHTML=`<p class="rules">${t.rules}</p><div id="tw" style="display:flex;flex-direction:column;align-items:center;gap:18px"></div>`;
  const w=$('tw'),id=t.w||t.id;
  if(id==='coin'){w.innerHTML=`<div class="coin" id="coin">?</div><button class="btn gold" id="go">동전 던지기</button><p class="keys" id="cnt"></p>`;let n=[0,0];
    $('go').onclick=()=>{const c=$('coin');c.classList.remove('flip');void c.offsetWidth;c.classList.add('flip');c.textContent='';pop();setTimeout(()=>{const r=Math.random()<.5?0:1;n[r]++;c.textContent=r?'뒤':'앞';ding();$('cnt').textContent=`앞면 ${n[0]}번 · 뒷면 ${n[1]}번`},950)}}
  if(id==='timer'){let sec=60,left=60;w.innerHTML=`<div class="row" id="ps"></div><div class="bigno" id="clk"></div><div class="ctrl"><button class="btn gold" id="go">시작</button><button class="btn" id="rs">다시</button></div>`;
    const dr=()=>{$('clk').textContent=left;$('clk').style.color=left<=5?'var(--t1)':''};
    const ps=()=>{$('ps').innerHTML='';[30,60,90,120].forEach(v=>{const b=el('button','pill'+(v===sec?' sel':''),v+'초');b.onclick=()=>{sec=left=v;clearInterval(swInt);$('go').textContent='시작';ps();dr()};$('ps').appendChild(b)})};ps();dr();
    $('rs').onclick=()=>{clearInterval(swInt);left=sec;$('go').textContent='시작';dr()};
    $('go').onclick=()=>{if($('go').textContent==='멈춤'){clearInterval(swInt);$('go').textContent='시작';return}if(left<=0)left=sec;$('go').textContent='멈춤';pop();
      swInt=setInterval(()=>{left--;dr();if(left<=3&&left>0)beep(520,.1,'square',.1);if(left<=0){clearInterval(swInt);buzz();confetti(60);$('go').textContent='시작'}},1000)}}
  if(id==='tele'){let d=shuffle(TELE),i=0;w.innerHTML=`<div class="card sm" id="tc"></div><div class="bigno" id="cd" style="font-size:90px;color:var(--gold);min-height:1em"></div><div class="ctrl"><button class="btn gold" id="go">하나, 둘, 셋!</button><button class="btn" id="nx">다음 문제</button></div>`;
    const dr=()=>{const q=d[i%d.length];$('tc').textContent=q.y?`${q.x}  vs  ${q.y}`:q.x;$('cd').textContent=''};dr();
    $('nx').onclick=()=>{i++;pop();dr()};$('go').onclick=()=>{let n=3;$('cd').textContent=n;beep(520,.12);clearInterval(swInt);swInt=setInterval(()=>{n--;if(n>0){$('cd').textContent=n;beep(520,.12)}else{clearInterval(swInt);$('cd').textContent='외쳐요!';ding()}},800)}}
  if(id==='limbo'){let hgt=120,rd=1;w.innerHTML=`<p class="chip" id="rd"></p><div class="bigno" id="hg"></div><div class="ctrl"><button class="btn" id="up">10cm 높이기</button><button class="btn gold" id="dn">10cm 낮추기</button></div>`;
    const dr=()=>{$('hg').textContent=hgt+'cm';$('rd').textContent=rd+'라운드'};dr();$('dn').onclick=()=>{if(hgt>40){hgt-=10;rd++;pop();dr()}};$('up').onclick=()=>{if(hgt<150){hgt+=10;rd=Math.max(1,rd-1);dr()}}}
  if(id==='bingo'){let pool=shuffle([...Array(50).keys()].map(x=>x+1)),called=[];w.innerHTML=`<div class="bigno" id="bn">?</div><button class="btn gold" id="go">번호 뽑기</button><div class="nums" id="nm"></div>`;
    const dr=()=>{$('nm').innerHTML=[...Array(50).keys()].map(x=>`<i class="${called.includes(x+1)?'on':''}">${x+1}</i>`).join('')};dr();
    $('go').onclick=()=>{if(!pool.length)return;const n=pool.pop();called.push(n);$('bn').textContent=n;pop();dr();if(!pool.length)$('go').textContent='모두 뽑았어요'}}
  if(id==='liar'){let n=4,cat,word,liar,i;const setup=()=>{w.innerHTML=`<p class="chip">몇 명이 하나요?</p><div class="row" id="ln"></div><button class="btn gold" id="go">시작</button>`;
      [3,4,5,6,7,8].forEach(v=>{const b=el('button','pill'+(v===n?' sel':''),v+'명');b.onclick=()=>{n=v;setup()};$('ln').appendChild(b)});
      $('go').onclick=()=>{const cs=Object.keys(LIAR);cat=cs[Math.random()*cs.length|0];word=LIAR[cat][Math.random()*10|0];liar=Math.random()*n|0;i=0;turn()}};
    const turn=()=>{pop();if(i>=n){w.innerHTML=`<p class="chip">주제: ${cat}</p><div class="card sm">모두 확인했어요. 한 마디씩 설명한 뒤 라이어를 지목하세요</div><button class="btn gold" id="lr">정답 공개</button>`;
        $('lr').onclick=()=>{ding();confetti(50);w.innerHTML=`<p class="chip">제시어: ${word}</p><div class="winner">라이어는 ${liar+1}번</div><button class="btn gold" id="la">한 판 더</button>`;$('la').onclick=setup};return}
      w.innerHTML=`<p class="chip">주제: ${cat}</p><div class="card sm">${i+1}번 사람만 화면을 보세요</div><button class="btn gold" id="ls">내 제시어 보기</button>`;
      $('ls').onclick=()=>{w.innerHTML=`<p class="chip">${i+1}번 · 주제: ${cat}</p><div class="card">${i===liar?'당신은 라이어':word}</div><button class="btn gold" id="lh">가리고 다음 사람에게</button>`;$('lh').onclick=()=>{i++;turn()}}};setup()}
  if(id==='bomb'){const chair=t.id==='chair';w.innerHTML=`<div class="card sm" id="bc">${chair?'음악을 틀고 시작을 누르세요':'주제를 뽑고 시작하세요'}</div><div class="bigno" id="bb" style="font-size:90px;min-height:1em;color:var(--gold)"></div><div class="ctrl"><button class="btn gold" id="go">시작</button></div>`;
    $('go').onclick=()=>{clearInterval(swInt);if(!chair)$('bc').textContent='주제: '+BOMB[Math.random()*BOMB.length|0];let left=(chair?8:12)+Math.floor(Math.random()*(chair?18:20)),n=0;$('bb').textContent='···';pop();
      swInt=setInterval(()=>{left--;n++;if(!chair)beep(n%2?620:520,.05,'square',.08);$('bb').textContent='·'.repeat(1+n%3);if(left<=0){clearInterval(swInt);buzz();$('bb').textContent=chair?'앉아요!':'펑!';confetti(70)}},1000)}}
  if(id==='order'){w.innerHTML=`<div class="card sm" id="oc">누가 될까요?</div><button class="btn gold" id="go">뽑기</button>`;
    $('go').onclick=()=>{let n=0;clearInterval(swInt);const fin=Math.random()*nTeams|0;swInt=setInterval(()=>{$('oc').textContent=teamNames[n%nTeams];beep(700,.04,'triangle',.1);n++;if(n>14&&(n-1)%nTeams===fin){clearInterval(swInt);ding();confetti(50)}},110)}}
}

/* ================= 꽃가루 ================= */
const cv=$('conf'),cx=cv.getContext('2d');let parts=[];const calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
function sizeCv(){cv.width=innerWidth;cv.height=innerHeight}sizeCv();addEventListener('resize',sizeCv);
function confetti(n){if(calm)return;const run=!parts.length;for(let i=0;i<n;i++)parts.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.3,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,c:['#d8b46a','#f1dba8','#d8546b','#4f8fe6','#3fbf8f'][i%5],a:Math.random()*6,w:5+Math.random()*6});if(run)loop()}
function loop(){cx.clearRect(0,0,cv.width,cv.height);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.a+=.1;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-5,p.w,10);cx.restore()});parts=parts.filter(p=>p.y<cv.height+30);if(parts.length)requestAnimationFrame(loop);else cx.clearRect(0,0,cv.width,cv.height)}

/* ================= 버튼·키보드 ================= */
$('revealBtn').onclick=reveal;$('nextBtn').onclick=next;$('hintBtn').onclick=hint;
document.querySelectorAll('[data-home]').forEach(b=>b.onclick=goHome);
$('usedBtn').onclick=()=>{USED={};saveUsed();renderHome();toast('문제 기록을 지웠어요. 모든 문제가 다시 나옵니다')};
$('resetBtn').onclick=()=>{scores=[0,0,0,0,0,0];mDone={};renderBoards();pop()};
$('mReset').onclick=()=>{mDone={};drawMusic()};
$('fsBtn').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}};
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||$('ov').classList.contains('on'))return;
  if($('quiz').classList.contains('on')){if(e.code==='Space'){e.preventDefault();next()}if(e.key==='h'||e.key==='H'||e.key==='ㅗ')hint()}
  if($('cards').classList.contains('on')){if(e.code==='Space'&&$('cOk')){e.preventDefault();$('cOk').click()}if((e.key==='p'||e.key==='P'||e.key==='ㅔ')&&$('cPass'))$('cPass').click()}
  if(!$('home').classList.contains('on')){const n=+e.key;if(n>=1&&n<=nTeams&&!$('cards').classList.contains('on'))addScore(n-1,1)}
});
renderHome();
</script>
