<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>콩콩 Party Game</title>
<meta name="theme-color" content="#f6f4fc">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="콩콩 Party">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Symbols+2&display=block&text=%E2%99%9A%E2%99%9B%E2%99%9C%E2%99%9D%E2%99%9E%E2%99%9F" rel="stylesheet">
<style>
/* 밝은 파티 라운지: 은은한 라벤더·복숭아·민트 빛 바탕 위 흰 카드, 보라→분홍→주황 그라데이션 포인트.
   홈은 작은 아이콘 타일 격자, 게임마다 준비 화면 → 진행 화면 → 결과 순서 */
:root{
  color-scheme:light;
  --bg:#f6f4fc; --card:#ffffff; --ink:#1d1a38; --muted:#6c698d; --line:#e8e5f3; --soft:#f3f1fa;
  --violet:#6c4cf5; --pink:#ff4d8d; --orange:#ff8a3d; --mint:#14b789; --sky:#2f9bff; --gold:#f5a524;
  --grad:linear-gradient(115deg,#6c4cf5 0%,#b84cf0 42%,#ff4d8d 72%,#ff8a3d 100%);
  --display:'Bagel Fat One','Noto Sans KR','Malgun Gothic',sans-serif;
  --body:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;
  --shadow:0 1px 2px rgba(40,30,90,.05),0 10px 28px rgba(70,50,160,.08);
  --t1:#ff4d8d; --t2:#2f9bff; --t3:#14b789; --t4:#f5a524; --t5:#8b5cf6; --t6:#ff7a45;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--body);color:var(--ink);background:var(--bg);overflow-x:hidden;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(900px 560px at -8% -12%,#e6dfff 0,transparent 60%),radial-gradient(760px 520px at 108% -6%,#ffe0ea 0,transparent 58%),radial-gradient(1000px 620px at 50% 118%,#d8f4ea 0,transparent 62%);background-attachment:fixed}
button{font-family:inherit;cursor:pointer;border:0;color:inherit;background:none}
input{font-family:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #b9a8ff;outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.screen{display:none;min-height:100%;padding:max(16px,env(safe-area-inset-top)) clamp(14px,3.4vw,40px) max(26px,env(safe-area-inset-bottom));flex-direction:column;gap:16px;max-width:1240px;margin:0 auto}
.screen.on{display:flex}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.center{justify-content:center;text-align:center}
.muted{color:var(--muted)}
.btn{border-radius:14px;padding:13px 24px;font-weight:800;font-size:17px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 10px 24px rgba(184,76,240,.32)}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.big{font-size:20px;padding:16px 34px;border-radius:16px}
.btn.sm{font-size:15px;padding:9px 16px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.link{font-size:13px;font-weight:700;color:var(--muted);padding:6px 8px;border-radius:8px}
.link:hover{color:var(--ink);background:#fff}
.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 15px;font-size:15px;font-weight:700;color:var(--muted)}
.pill.sel{background:var(--ink);border-color:var(--ink);color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 14px;font-size:15px;font-weight:700;background:var(--soft);color:var(--muted)}

/* ---------- 홈 ---------- */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:56px;height:56px;flex:none;filter:drop-shadow(0 6px 12px rgba(108,76,245,.25))}
.brand .w1{font-family:var(--display);font-weight:400;font-size:clamp(32px,4.6vw,48px);line-height:.95;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;display:block}
.brand .w2{font-family:var(--display);font-size:clamp(13px,1.6vw,17px);letter-spacing:.32em;color:var(--ink);display:block;margin-top:4px}
.top .sp{flex:1}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
.seg button{border-radius:999px;padding:7px 14px;font-weight:800;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}
.iconbtn{width:42px;height:42px;border-radius:50%;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);font-size:18px;display:grid;place-items:center}
.search{position:relative;flex:1;min-width:220px}
.search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:999px;padding:13px 18px 13px 46px;font-size:16px;color:var(--ink);box-shadow:var(--shadow)}
.search span{position:absolute;left:17px;top:50%;transform:translateY(-50%);font-size:17px;opacity:.6}
.teams{padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.teams .lab{font-weight:900;font-size:14px;margin-right:2px}
.tchip{display:flex;align-items:center;gap:6px;background:var(--soft);border-radius:12px;padding:5px 6px 5px 10px}
.tchip i{width:10px;height:10px;border-radius:50%;flex:none}
.tchip input{border:0;background:transparent;font-size:14px;font-weight:700;width:76px;color:var(--ink)}
.tchip b{font-family:var(--display);font-weight:400;font-size:17px;min-width:22px;text-align:center;color:var(--c)}
.sect{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.sect h2{font-size:19px;font-weight:900}
.sect span{font-size:13px;color:var(--muted);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.tile{position:relative;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 8px 11px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.tile:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(80,50,180,.16)}
.tile .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:25px;background:var(--tint,#f1edff);font-weight:900}
.tile .nm{font-weight:700;font-size:13.5px;line-height:1.25;text-align:center;word-break:keep-all}
.tile .ic.txt,.hero .ic.txt{white-space:nowrap;letter-spacing:-.02em;font-family:var(--body)}
.tile .ic.txt{font-size:19px}
.hero .ic.txt{font-size:32px}
.brand .w1,.brand .w2,.cho,.answer,.winner,.clock,.bigno,.tb .sc,.tchip b,.mcell,.timer .t,.rank b,.bal .vs,.coin{font-weight:900;font-synthesis:none}
.tile .no{position:absolute;top:7px;left:9px;font-size:11px;color:#b4b0cc;font-weight:800}
.empty{padding:28px;text-align:center;color:var(--muted);font-weight:700}

/* ---------- 공통 상단바 ---------- */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.backbtn{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 16px 8px 12px;font-weight:800;font-size:15px;box-shadow:var(--shadow)}
.bar h2{font-size:22px;font-weight:900;display:flex;align-items:center;gap:8px}
.bar .prog{margin-left:auto;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- 게임 준비 화면 ---------- */
.lobby{max-width:720px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.hero{padding:26px 22px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--grad)}
.hero .ic{width:84px;height:84px;border-radius:24px;display:grid;place-items:center;font-size:46px;background:var(--tint,#f1edff);font-weight:900}
.hero h1{font-size:clamp(26px,4vw,36px);font-weight:900}
.hero p{color:var(--muted);line-height:1.6;max-width:52ch}
.opt{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.opt h3{font-size:14px;font-weight:900;color:var(--muted);letter-spacing:.04em}

/* ---------- 문제 화면 ---------- */
.board{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tb{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:5px 6px 5px 12px;box-shadow:var(--shadow);border-bottom:3px solid var(--c);transition:transform .2s}
.tb.bump{transform:scale(1.12)}
.tb .nm{font-size:14px;font-weight:700}
.tb .sc{font-family:var(--display);font-size:24px;min-width:30px;text-align:center;color:var(--c);font-variant-numeric:tabular-nums}
.tb button{width:30px;height:30px;border-radius:9px;background:var(--soft);font-size:18px;font-weight:800;color:var(--muted)}
.tb button:hover{background:var(--c);color:#fff}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:22px 16px;min-height:330px;position:relative}
.timer{position:relative;width:84px;height:84px;flex:none}
.timer svg{transform:rotate(-90deg)}
.timer .t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums}
.timer.low .t{color:var(--pink)}
.flag{width:min(78vw,420px,50vh);border-radius:8px;overflow:hidden;box-shadow:0 0 0 1px var(--line),0 18px 40px rgba(40,30,90,.18);background:#fff}
.flag svg,.flag img{display:block;width:100%}
.cho{font-family:var(--display);font-size:clamp(52px,11vw,140px);letter-spacing:.12em;line-height:1.2;max-width:94vw;word-break:keep-all;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.cho.long{font-size:clamp(30px,5.4vw,70px);letter-spacing:.06em}
.cho.en{letter-spacing:.24em}
.qtext{font-weight:900;font-size:clamp(26px,4.3vw,52px);line-height:1.38;max-width:980px;word-break:keep-all}
.emo{font-size:clamp(62px,11vw,140px);letter-spacing:.08em;line-height:1.15}
.hints{display:flex;flex-direction:column;gap:10px;width:min(92vw,740px)}
.hints div{background:var(--soft);border-radius:14px;padding:14px 18px;font-size:clamp(18px,2.4vw,26px);text-align:left;display:flex;gap:14px;font-weight:500;line-height:1.4}
.hints div b{color:var(--violet);white-space:nowrap;font-weight:900}
.zoom{width:min(68vw,330px,44vh);aspect-ratio:1;border-radius:24px;overflow:hidden;border:1px solid var(--line);background:#fff;display:grid;place-items:center;box-shadow:0 18px 40px rgba(40,30,90,.14)}
.zoom>*{transition:transform .7s cubic-bezier(.2,.8,.2,1),filter .7s}
.zoom span{font-size:min(48vw,230px,30vh);line-height:1}
.zoom img{width:100%;height:100%;object-fit:contain}
.zoom.photo{width:min(86vw,700px);height:min(50vh,460px);aspect-ratio:auto;background:#111}
.zoom.pz{position:relative;width:min(88vw,560px,62vh);aspect-ratio:4/3;background:#efedf7}
.zoom.pz img{position:absolute;inset:0;object-fit:cover;opacity:0;transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .35s}
.zoom.pz.ok img{opacity:1}.zoom.pz.full img{object-fit:contain}
.zoom.pz .ld{position:absolute;inset:0;display:grid;place-items:center;padding:18px;text-align:center;color:var(--muted);font-weight:700}
.zoom.pz .ld:empty::after{content:'';width:34px;height:34px;border-radius:50%;border:4px solid #ddd6f5;border-top-color:#6c4cf5;animation:spin .8s linear infinite}
.zoom.pz.ok .ld{display:none}
.zoom.pz.fail img{display:none}.zoom.pz .ld{z-index:1}.zoom.pz .ld p{margin:0 0 12px}
.zoom.pz .cr{position:absolute;right:8px;bottom:6px;font-size:10px;color:#fff;opacity:0;text-shadow:0 1px 3px rgba(0,0,0,.7);transition:opacity .3s}
.zoom.pz.full .cr{opacity:.85}
@keyframes spin{to{transform:rotate(360deg)}}
.zsave{align-items:center;text-align:center}.small{font-size:12px}
.bal{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;width:min(94vw,980px)}
.bal button{background:#fff;border:1px solid var(--line);border-radius:22px;padding:34px 18px;font-weight:900;font-size:clamp(22px,3.4vw,40px);line-height:1.35;word-break:keep-all;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.bal button:nth-child(1){border-top:6px solid var(--pink)} .bal button:nth-child(3){border-top:6px solid var(--sky)}
.bal button small{font-size:17px;color:var(--muted);font-weight:700}
.bal .vs{align-self:center;font-family:var(--display);font-size:30px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.answer{font-family:var(--display);font-size:clamp(32px,5.6vw,66px);color:var(--violet);min-height:1.3em;opacity:0;transform:translateY(10px);transition:.35s;word-break:keep-all;max-width:94vw;line-height:1.25}
.answer.show{opacity:1;transform:none}
.answer small{display:block;font-family:var(--body);font-size:clamp(15px,2vw,19px);color:var(--muted);margin-top:6px;font-weight:500}
.ctrl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.keys{color:var(--muted);font-size:13px;text-align:center}

/* ---------- 카드 게임 ---------- */
.bigcard{width:min(92vw,760px);min-height:220px;display:grid;place-items:center;padding:30px;border-radius:28px;border:4px solid transparent;background:linear-gradient(#fff,#fff) padding-box,var(--grad) border-box;box-shadow:0 22px 50px rgba(108,76,245,.2);font-weight:900;font-size:clamp(38px,7.4vw,96px);line-height:1.25;word-break:keep-all;text-align:center}
.bigcard.sm{font-size:clamp(24px,3.8vw,46px);line-height:1.5}
.clock{font-family:var(--display);font-size:clamp(56px,10vw,110px);line-height:1;font-variant-numeric:tabular-nums;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.rules{max-width:680px;color:var(--muted);line-height:1.7;font-size:16px;text-align:center}
.winner{font-family:var(--display);font-size:clamp(36px,7vw,84px);background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center;line-height:1.15}

/* ---------- 음악 ---------- */
.mgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;width:min(96vw,1080px);margin:0 auto}
.mgrid .hd{font-weight:900;text-align:center;font-size:clamp(12px,1.6vw,16px);padding:6px 2px;word-break:keep-all}
.mcell{aspect-ratio:1.5;border-radius:16px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);font-family:var(--display);font-size:clamp(22px,3.6vw,42px);color:var(--violet)}
.mcell:hover{background:var(--grad);color:#fff}
.mcell.done{background:var(--soft);color:var(--muted);font-family:var(--body);font-size:14px;font-weight:700;box-shadow:none;cursor:default}

/* ---------- 결과 ---------- */
.rank{width:min(92vw,520px);display:flex;flex-direction:column;gap:10px}
.rank div{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;padding:14px 20px;font-size:20px;font-weight:700;box-shadow:var(--shadow)}
.rank b{font-family:var(--display);font-weight:400;color:var(--c)}

/* ---------- 도구 ---------- */
.bigno{font-family:var(--display);font-size:clamp(78px,15vw,180px);line-height:1;font-variant-numeric:tabular-nums}
.coin{width:180px;height:180px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe7a8,#f5a524 60%,#b87410);color:#5a3700;display:grid;place-items:center;font-family:var(--display);font-size:56px;box-shadow:0 18px 40px rgba(180,110,10,.35),inset 0 0 0 8px #fff5}
.coin.flip{animation:flip 1s ease-out}
@keyframes flip{50%{transform:rotateX(900deg) translateY(-90px)}to{transform:rotateX(1800deg)}}
.nums{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;width:min(92vw,600px)}
.nums i{font-style:normal;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 0;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:700}
.nums i.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ---------- 오목 ---------- */
.omok{display:grid;grid-template-columns:minmax(0,auto) minmax(220px,300px);gap:18px;align-items:start;justify-content:center}
@media (max-width:820px){.omok{grid-template-columns:1fr}}
.gob{width:min(92vw,74vh,640px);aspect-ratio:1;border-radius:18px;box-shadow:0 22px 50px rgba(120,70,20,.28);touch-action:manipulation;cursor:pointer;display:block;margin:0 auto}
.side{padding:18px;display:flex;flex-direction:column;gap:12px}
.pl{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--soft);font-weight:800}
.pl.on{background:var(--ink);color:#fff}
.stone{width:22px;height:22px;border-radius:50%;flex:none}
.stone.b{background:radial-gradient(circle at 35% 30%,#666,#111 60%)}
.stone.w{background:radial-gradient(circle at 35% 30%,#fff,#d9d6cf 70%);box-shadow:inset 0 0 0 1px #bbb}
/* ---------- 체스 ---------- */
.chess{display:grid;grid-template-columns:minmax(0,auto) minmax(250px,310px);gap:18px;align-items:start;justify-content:center}
@media (max-width:820px){.chess{grid-template-columns:1fr}}
.cbw{position:relative;width:min(92vw,68vh,640px);margin:0 auto}
.cbd{width:100%;aspect-ratio:1;display:block;border-radius:14px;box-shadow:0 22px 50px rgba(70,45,20,.28);touch-action:manipulation;cursor:pointer;user-select:none;-webkit-user-select:none}
.cbd,.cap,.promo .opts button{font-family:'Noto Sans Symbols 2','Segoe UI Symbol','Apple Symbols','DejaVu Sans',sans-serif}
.cbd .mv{animation:pcmv .24s cubic-bezier(.2,.8,.2,1)}
@keyframes pcmv{from{transform:translate(var(--dx),var(--dy))}}
.cmsg{text-align:center;font-weight:800;font-size:18px;margin:2px 0 12px;min-height:1.4em}
.cmsg.chk{color:#e0245e}.cmsg.end{font-size:21px;color:var(--accent,#6c4cf5)}
.cap{font-size:19px;letter-spacing:-3px;line-height:1}
.wp{color:#fffdf7;-webkit-text-stroke:1.1px #3b3340}.bp{color:#26212c}
.cpl{flex-wrap:wrap;row-gap:4px}.cpl.on{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2.5px #6c4cf5}
.cpl .nm{white-space:nowrap}.cpl .cl{margin-left:auto;font-weight:700;white-space:nowrap}
.cpl .cr{flex-basis:100%;display:flex;align-items:center;gap:6px;padding-left:32px;min-height:0}.cpl small{font-weight:800;opacity:.7}
.mvlist{max-height:150px;overflow:auto;font-size:14px;line-height:1.8;background:var(--soft);border-radius:12px;padding:8px 12px}
.mvlist span{white-space:nowrap;margin-right:6px}
.promo{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,16,40,.38);border-radius:14px}
.promo .box{background:#fff;border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;align-items:center;box-shadow:0 20px 50px rgba(20,16,40,.3)}
.promo .opts{display:flex;gap:8px}
.promo .opts button{width:62px;height:62px;font-size:44px;line-height:1;border-radius:14px;border:1px solid var(--line);background:#f4f1ea}
.msg{font-weight:900;font-size:20px;text-align:center;min-height:1.4em}

/* ---------- 대화상자·알림 ---------- */
.ov{position:fixed;inset:0;background:rgba(29,26,56,.45);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:30;padding:18px}
.ov.on{display:flex}
.dlg{background:#fff;border-radius:22px;padding:24px;width:min(94vw,640px);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:16px;text-align:center;box-shadow:0 30px 80px rgba(20,10,60,.35)}
.dlg h2{font-size:24px;font-weight:900}
#toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-30px);opacity:0;background:var(--ink);color:#fff;border-radius:14px;padding:11px 18px;z-index:60;transition:.3s;font-size:15px;font-weight:700;max-width:92vw;text-align:center;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
canvas#conf{position:fixed;inset:0;pointer-events:none;z-index:50}
#installBar{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:70;width:min(94vw,540px);background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:0 20px 50px rgba(40,20,100,.25);display:none;flex-direction:column;gap:10px}
#installBar.on{display:flex}
#installBar b{font-weight:900;font-size:17px}
#installBar p{font-size:14.5px;line-height:1.55;color:var(--muted)}
#installBar .r{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
#installBar button,#installBar a{border-radius:12px;padding:9px 16px;font-size:15px;font-weight:800;border:1px solid var(--line);background:#fff;color:var(--ink);text-decoration:none;cursor:pointer}
#installBar .go{background:var(--grad);color:#fff;border-color:transparent}
@media (max-width:560px){.bal{grid-template-columns:1fr}.mgrid{gap:6px}#fsBtn{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="conf"></canvas>
<div id="toast" role="status"></div>
<div class="ov" id="ov"><div class="dlg" id="dlg"></div></div>
<input type="file" id="pFiles" accept="image/*" multiple hidden>

<section class="screen on" id="home">
  <div class="top">
    <div class="brand" aria-label="콩콩 Party Game">
      <svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6c4cf5"/><stop offset=".55" stop-color="#ff4d8d"/><stop offset="1" stop-color="#ff8a3d"/></linearGradient></defs><rect width="64" height="64" rx="18" fill="url(#lg)"/><ellipse cx="23" cy="35" rx="11" ry="14" fill="#fff6e2"/><ellipse cx="41" cy="35" rx="11" ry="14" fill="#ffd77a"/><path d="M18 33q5-5 10 0M36 33q5-5 10 0" stroke="#2a1f4a" stroke-width="2.4" fill="none" stroke-linecap="round"/><circle cx="12" cy="13" r="2.5" fill="#fff"/><circle cx="52" cy="12" r="2" fill="#ffe27a"/><circle cx="50" cy="54" r="2.2" fill="#fff"/></svg>
      <div><span class="w1">콩콩</span><span class="w2">PARTY GAME</span></div>
    </div>
    <div class="sp"></div>
    <div class="seg" role="group" aria-label="Language"><button data-lang="ko">한국어</button><button data-lang="en">English</button></div>
    <button class="iconbtn" id="fsBtn" aria-label="Fullscreen">⛶</button>
  </div>
  <div class="row" style="gap:10px">
    <label class="search"><span>🔍</span><input id="q" type="search" autocomplete="off"></label>
  </div>
  <div class="card teams" id="teams"></div>
  <div id="sections"></div>
</section>

<section class="screen" id="lobby"></section>
<section class="screen" id="play"></section>
<section class="screen" id="result"></section>

function genMath(lv){const r=(a,b)=>a+Math.floor(Math.random()*(b-a+1));const out=[];
  for(let i=0;i<40;i++){let q,a;const k=Math.random()<.5;
    if(lv===1){if(k){const x=r(1,20),y=r(1,9);q=`${x} + ${y}`;a=x+y}else{const x=r(5,20),y=r(1,Math.min(9,x));q=`${x} − ${y}`;a=x-y}}
    else if(lv===2){if(k){const x=r(10,89),y=r(10,99-x);q=`${x} + ${y}`;a=x+y}else{const x=r(30,99),y=r(10,x-1);q=`${x} − ${y}`;a=x-y}}
    else if(lv===3){const x=r(2,9),y=r(2,9);q=`${x} × ${y}`;a=x*y}
    else if(lv===4){if(Math.random()<.6){const x=r(12,99),y=r(2,9);q=`${x} × ${y}`;a=x*y}else{const y=r(2,9),z=r(3,19);q=`${z*y} ÷ ${y}`;a=z}}
    else{const x=r(11,99),y=r(11,99);q=`${x} × ${y}`;a=x*y}
    if(out.some(o=>o.q===q)){i--;continue}out.push({q,a:String(a)})}
  return out}

const keyOf=q=>typeof q==='string'?q:[q.a,q.q,q.e,q.x,q.p].filter(Boolean).join('|');

function markUsed(g,q){if(!g||g.gen)return;const k=ukey(g);USED[k]=USED[k]||[];const s=keyOf(q);if(!USED[k].includes(s)){USED[k].push(s);store.set('kongkong_used',USED)}}
function leftCount(g,data){const u=new Set(USED[ukey(g)]||[]);return data.filter(q=>!u.has(keyOf(q))).length}
function pickFresh(g,data,n){
  const k=ukey(g),u=new Set(USED[k]||[]),want=n||data.length;let fresh=shuffle(data.filter(q=>!u.has(keyOf(q))));
  if(g.gen||fresh.length>=want)return {list:fresh.slice(0,want),note:''};
  if(!fresh.length){USED[k]=[];store.set('kongkong_used',USED);return {list:shuffle(data).slice(0,want),note:t('recycled')}}
  const used=shuffle(data.filter(q=>u.has(keyOf(q))));const fill=used.slice(0,want-fresh.length);USED[k]=used.slice(want-fresh.length).map(keyOf);store.set('kongkong_used',USED);
  return {list:[...fresh,...fill],note:t('partial',fresh.length)};
}

/* ================= 화면 이동과 뒤로 가기 =================
   기록: home(0) → lobby(1) → play(2). 결과는 play 자리를 바꿔 끼워서, 뒤로 가기를 누르면 그 게임의 준비 화면으로 돌아가요. */
let SES=null; const timers=new Set();
const later=(f,ms)=>{const id=setTimeout(()=>{timers.delete(id);f()},ms);timers.add(id);return id};
const every=(f,ms)=>{const id=setInterval(f,ms);timers.add(id);return id};
function stopAll(){timers.forEach(id=>{clearTimeout(id);clearInterval(id)});timers.clear();closeDlg()}
function show(id){const was=document.querySelector('.screen.on');document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));if(!was||was.id!==id||show.last!==SES)scrollTo(0,0);show.last=SES}
function depth(){return (history.state&&history.state.d)||0}
function nav(v,g,replace){const st={v,g:g||null,d:replace?depth():depth()+1};try{replace?history.replaceState(st,''):history.pushState(st,'')}catch(e){}route(st)}
function goBack(){if(depth()>0)history.back();else route({v:'home'})}
function goHome(){const d=depth();if(d>0)history.go(-d);else route({v:'home'})}
addEventListener('popstate',e=>route(e.state||{v:'home'}));
function route(st){
  stopAll();const g=st&&st.g&&GBY[st.g];
  if(g&&isEN()&&g.ko){return home()}
  if(g&&g.tool&&(st.v==='lobby'||st.v==='play'))return tool(g);
  if(st.v==='lobby'&&g)return lobby(g);
  if(st.v==='tool'&&g)return tool(g);
  if(st.v==='play'&&g){if(SES&&SES.g===g){return resume()}return nav('lobby',g.id,true)}
  if(st.v==='result'&&g){if(SES&&SES.g===g&&SES.over)return result();return nav('lobby',g.id,true)}
  return home();
}

function renderTiles(){
  const q=$('#q').value.trim().toLowerCase();const box=$('#sections');box.innerHTML='';let any=false,no=0,letter=0;
  [['quiz','secQuiz'],['team','secTeam'],['board','secBoard'],['tool','secTools']].forEach(([cat,key],si)=>{
    const all=visible().filter(g=>g.cat===cat);
    const list=all.filter(g=>{if(!q)return true;const hay=(g.name.ko+' '+(g.name.en||'')+' '+g.id).toLowerCase();return hay.includes(q)});
    const numbered=all.map(g=>[g,cat==='tool'?String.fromCharCode(65+letter++):String(++no)]);
    if(!list.length)return;any=true;
    const h=el('div','sect',`<h2>${esc(t(key))}</h2><span>${list.length}</span>`);box.appendChild(h);
    const grid=el('div','grid');
    numbered.filter(([g])=>list.includes(g)).forEach(([g,label],k)=>{const b=el('button','tile',`<span class="no">${label}</span><span class="ic${/[ㄱ-ㅎ]/.test(g.ic)?' txt':''}">${g.ic}</span><span class="nm">${esc(gname(g))}</span>`);
      b.style.setProperty('--tint',TINTS[(k+si*3)%TINTS.length]);b.onclick=()=>{pop();g.tool?nav('tool',g.id):nav('lobby',g.id)};grid.appendChild(b)});
    box.appendChild(grid)});
  if(!any)box.appendChild(el('div','card empty',esc(t('none'))));
}

/* 포스터·사진: 이 기기의 브라우저 저장소(IndexedDB)에만 저장되고 어디에도 올라가지 않아요 */
const IDB={db:null,open(){return new Promise((res,rej)=>{if(this.db)return res(this.db);try{const r=indexedDB.open('kongkong',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos',{keyPath:'id'});r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
 async run(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const tx=db.transaction('photos',mode);const st=tx.objectStore('photos');const out=fn(st);tx.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);tx.onerror=()=>rej(tx.error)})},
 all(){return this.run('readonly',st=>st.getAll())},add(list){return this.run('readwrite',st=>{list.forEach(x=>st.put(x))})},clear(){return this.run('readwrite',st=>st.clear())}};
const nameOf=f=>f.name.replace(/\.[^.]+$/,'').replace(/^\d+[_ .-]+/,'').replace(/[_-]+/g,' ').trim();
let photoURLs=[];
function photoQuiz(g,items){photoURLs.forEach(u=>URL.revokeObjectURL(u));photoURLs=[];
  const data=items.map(x=>{const u=URL.createObjectURL(x.blob);photoURLs.push(u);return {img:u,a:x.name,mode:S.pmode}});
  const pf=pickFresh(g,data,S.num);toast(pf.note);SES={g,type:'quiz',list:pf.list,idx:0};nav('play',g.id)}
function photoLobby(g,wrap){
  const box=el('div','card opt');box.style.alignItems='center';box.style.textAlign='center';const info=el('p','',esc(t('saved',0)));info.style.fontWeight='800';box.appendChild(info);
  const r=el('div','row center');const use=el('button','btn pri big',esc(t('useSaved')));use.disabled=true;const add=el('button','btn',esc(t('addPhotos')));r.append(use,add);box.appendChild(r);
  const clr=el('button','link',esc(t('clearPhotos')));clr.style.display='none';box.appendChild(clr);box.appendChild(el('p','muted',esc(t('photoHow'))));wrap.appendChild(box);
  let saved=[];IDB.all().then(l=>{saved=l||[];info.textContent=t('saved',saved.length);use.disabled=!saved.length;clr.style.display=saved.length?'':'none'}).catch(()=>{info.textContent=''});
  use.onclick=()=>{if(saved.length)photoQuiz(g,saved)};
  clr.onclick=()=>{IDB.clear().then(()=>{toast(t('photosCleared'));lobby(g)}).catch(()=>{})};
  add.onclick=()=>{const f=$('#pFiles');f.value='';f.onchange=()=>{const fs=[...f.files].filter(x=>x.type.startsWith('image/'));if(!fs.length)return;
    const items=fs.map(x=>({id:x.name+'|'+x.size,name:nameOf(x),blob:x,t:Date.now()}));
    IDB.add(items).then(()=>{toast(t('photosAdded',items.length));lobby(g)}).catch(()=>photoQuiz(g,items))};f.click()};
}

const CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const cho=s=>[...s].map(c=>{const n=c.charCodeAt(0)-0xAC00;return n>=0&&n<11172?CHO[Math.floor(n/588)]:c}).join('');
const mask=a=>/[가-힣]/.test(a)?a[0]+cho(a.slice(1)):a.split('').map((c,i)=>i===0||!/[A-Za-z0-9]/.test(c)?c:'_').join('');
const ZL=[7,4,2.2,1],BL=[26,13,5,0];
let tLeft=0,tTotal=0,tId=null;
function matchSVG(eq,col){const seg={a:[12,6,48,6],b:[54,12,54,54],c:[54,66,54,108],d:[12,114,48,114],e:[6,66,6,108],f:[6,12,6,54],g:[12,60,48,60]};
  const DG={0:'abcdef',1:'bc',2:'abdeg',3:'abcdg',4:'bcfg',5:'acdfg',6:'acdefg',7:'abc',8:'abcdefg',9:'abcdfg'};let x=0,o='';
  const st=(a,b,c,d)=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${col||'#e0a24f'}" stroke-width="7" stroke-linecap="round"/><circle cx="${a}" cy="${b}" r="5.5" fill="#d6453d"/>`;
  for(const ch of eq){let s=[];if(DG[ch]!=null)s=[...DG[ch]].map(k=>seg[k]);else if(ch==='+')s=[[10,60,50,60],[30,38,30,82]];else if(ch==='-')s=[[10,60,50,60]];else if(ch==='=')s=[[10,46,50,46],[10,74,50,74]];o+=`<g transform="translate(${x},0)">${s.map(p=>st(...p)).join('')}</g>`;x+=84}
  return `<svg viewBox="-8 -6 ${x} 132" style="width:min(88vw,${x*1.5}px);display:block" role="img" aria-label="${eq}">${o}</svg>`}

function loadQ(){

  if(k==='balance'){q.v=q.v||[0,0];h=`<div class="bal"><button id="bA">${esc(q.x)}<small id="vA"></small></button><span class="vs">VS</span><button id="bB">${esc(q.y)}<small id="vB"></small></button></div><p class="keys">${esc(t('balTip'))}</p>`}

function drawHints(){const q=SES.list[SES.idx];$('#hintBox').innerHTML=q.h.slice(0,SES.step+1).map((x,i)=>`<div><b>${esc(t('hintN',i+1))}</b><span>${esc(x)}</span></div>`).join('');$('#hintBtn').textContent=SES.step<q.h.length-1?t('nextHint'):t('hintEnd')}

    ld.querySelector('button').onclick=()=>{pop();S.zsrc='emoji';saveS();const g=SES.g;const pf=pickFresh(g,itemsOf(g),S.num);SES={g,type:'quiz',list:pf.list,idx:0};quizShow()}};
  z.src=q.img;const nq=SES.list[SES.idx+1];if(nq&&nq.img){const im=new Image();im.src=nq.img}}
const ZLP=[4.5,2.8,1.7,1];
function drawZoom(){const z=$('#zi');if(!z)return;const q=SES.list[SES.idx],m=q.mode||'zoom',s=SES.revealed?3:Math.min(SES.step,3);
  if(SES.g.kind==='zoom'&&q.img){z.style.transform=`scale(${ZLP[s]})`;$('#zbox').classList.toggle('full',s===3);$('#hintBtn').textContent=t('zoomOut');return}
  z.style.transform=m==='zoom'?`scale(${ZL[s]})`:'none';z.style.filter=m==='blur'?`blur(${BL[s]}px)`:'none';$('#hintBtn').textContent=m==='plain'?t('hint'):(m==='blur'?t('sharper'):t('zoomOut'))}
function partial(h){const A=$('#answer');A.innerHTML=h;A.classList.add('show')}
function hint(){
  if(SES.revealed)return;const q=SES.list[SES.idx],k=SES.g.kind;pop();
  if(k==='hints'){if(SES.step<q.h.length-1){SES.step++;drawHints()}return}
  if(k==='zoom'||(k==='photo'&&q.mode!=='plain')){if(SES.step<2){SES.step++;drawZoom()}else partial(esc(mask(q.a)));return}
  if(k==='match'){const d=[...q.q].map((c,i)=>c!==q.a[i]?t('parts')[i]:'').filter(Boolean);partial(`<small>${esc(t('changed')+d.join(', '))}</small>`);return}
  if(k==='text'&&q.ox)return;
  if(q.a)partial(esc(mask(q.a)));
}
function reveal(silent){
  if(SES.revealed)return;SES.revealed=true;stopTimer();const q=SES.list[SES.idx],k=SES.g.kind,A=$('#answer');

function checkWin(i,col){for(const [dx,dy] of DIRS){const line=[i];for(const s of [1,-1]){let x=i%N+dx*s,y=(i/N|0)+dy*s;while(x>=0&&y>=0&&x<N&&y<N&&O.b[y*N+x]===col){line.push(y*N+x);x+=dx*s;y+=dy*s}}if(line.length>=5)return line}return null}

  if(O.over&&O.win)SES.rec[O.turn-1]=Math.max(0,SES.rec[O.turn-1]-1);O.over=false;O.win=null;O.turn=O.moves.length%2===0?1:2;if(O.mode==='cpu'&&O.human===2&&!O.moves.length){omokNew()}pop();omokShow();cpuIfNeeded()}
const PATS=[['xxxxx',1e6],['_xxxx_',1e5],['xxxx_',1.2e4],['_xxxx',1.2e4],['xxx_x',1.1e4],['x_xxx',1.1e4],['xx_xx',1.1e4],['_xxx_',5e3],['_xx_x_',4.5e3],['_x_xx_',4.5e3],
 ['xxx__',600],['__xxx',600],['xx_x_',550],['_x_xx',550],['x_xx_',550],['_xx_x',550],['x__xx',400],['xx__x',400],['x_x_x',400],['__xx__',260],['_xx__',200],['__xx_',200],['_x_x_',180],['_x__x_',60],['xx___',40],['___xx',40]];
function lineStr(i,dx,dy,col){let s='';const x0=i%N,y0=i/N|0;for(let k=-5;k<=5;k++){const x=x0+dx*k,y=y0+dy*k;if(x<0||y<0||x>=N||y>=N){s+='#';continue}const v=k===0?col:O.b[y*N+x];s+=v===col?'x':v===0?'_':'#'}return s}
function dirScore(s){let best=0;for(const [p,v] of PATS){if(v<=best)continue;let j=s.indexOf(p);while(j!==-1){if(j<=5&&j+p.length>5){best=v;break}j=s.indexOf(p,j+1)}}return best}
function cellScore(i,col){let s=0;for(const [dx,dy] of DIRS)s+=dirScore(lineStr(i,dx,dy,col));return s}

function aiMove(me){
  const opp=3-me,lv=O.level,W={easy:.55,normal:.9,hard:1}[lv];
  let scored=candidates().map(i=>{const x=i%N,y=i/N|0;return {i,v:cellScore(i,me)+cellScore(i,opp)*W-(Math.abs(x-7)+Math.abs(y-7))*.5}}).sort((a,b)=>b.v-a.v);
  if(lv==='easy'){const top=scored.filter(s=>s.v>=scored[0].v*.4).slice(0,6);if(scored[0].v<1e5&&Math.random()<.55)return rnd(top).i;return scored[0].i}
  if(lv==='hard'&&scored[0].v<1e5){scored=scored.slice(0,8).map(s=>{O.b[s.i]=me;let worst=0;for(const j of candidates()){const r=cellScore(j,opp)+cellScore(j,me)*.8;if(r>worst)worst=r}O.b[s.i]=0;return {i:s.i,v:s.v-.55*worst}}).sort((a,b)=>b.v-a.v)}

  const wrap=el('div','chess'),bw=el('div','cbw');bw.innerHTML=chessSVG();CH.anim=null;wrap.appendChild(bw);
  if(CH.promo){const o=el('div','promo');o.innerHTML=`<div class="box"><b>${esc(t('promo'))}</b><div class="opts">${[5,4,3,2].map(k=>`<button data-p="${k}" class="${CE.turn>0?'wp':'bp'}">${gly(k)}</button>`).join('')}</div><button class="link" data-p="0">${esc(t('chCancel'))}</button></div>`;
    o.querySelectorAll('button').forEach(bn=>bn.onclick=e=>{e.stopPropagation();pop();const k=+bn.dataset.p,ms=CH.promo;CH.promo=null;if(!k){CH.sel=null;CH.tg=null;return chessShow()}chessDo(ms.find(m=>m.pr===k))});bw.appendChild(o)}
  const row=c=>{const adv=chessMat(c),cp=chessCaps(c);return `<div class="pl cpl${!CH.res&&CE.turn===c?' on':''}"><span class="stone ${c>0?'w':'b'}"></span><span class="nm">${esc(cname(c))}</span><span class="muted cl">${esc(c>0?t('cW'):t('cB'))}</span>${cp||adv>0?`<div class="cr"><span class="cap ${c>0?'bp':'wp'}">${cp}</span>${adv>0?`<small>+${adv}</small>`:''}</div>`:''}</div>`};
  const H=CE.hist;let ml='';for(let i=0;i<H.length;i+=2)ml+=`<span><b>${i/2+1}.</b> ${esc(H[i].san)}${H[i+1]?' '+esc(H[i+1].san):''}</span> `;
  const side=el('div','card side');
  side.innerHTML=`${row(1)}${row(-1)}<div class="row"><button class="btn sm" id="cUndo">${esc(t('undo'))}</button><button class="btn sm" id="cFlip">${esc(t('flip'))}</button><button class="btn sm pri" id="cNew">${esc(t('restart'))}</button></div>
    <p class="muted" style="font-weight:800;margin:0">${esc(t('record'))}: ${esc(CH.mode==='cpu'?t('me'):teamName(0))} ${SES.rec[0]} : ${SES.rec[1]} ${esc(CH.mode==='cpu'?t('cpu'):teamName(1))}</p>
    ${H.length?`<div class="mvlist" id="mvl">${ml}</div>`:''}<p class="muted" style="font-size:14px;line-height:1.6;margin:0">${esc(t('chHelp'))}</p>`;
  wrap.appendChild(side);sc.appendChild(wrap);
  const u=$('#cUndo');u.disabled=CH.busy||!H.length;u.onclick=chessUndo;
  $('#cFlip').onclick=()=>{pop();CH.flip=!CH.flip;chessShow()};$('#cNew').onclick=()=>{pop();chessNew();chessShow()};
  const svg=bw.querySelector('svg');svg.addEventListener('click',ev=>{const r=svg.getBoundingClientRect(),dc=Math.floor((ev.clientX-r.left)/r.width*8),dr=Math.floor((ev.clientY-r.top)/r.height*8);if(dc<0||dr<0||dc>7||dr>7)return;chessTap(CH.flip?(7-dr)*8+(7-dc):dr*8+dc)});
  const mvl=$('#mvl');if(mvl)mvl.scrollTop=mvl.scrollHeight;
  show('play');if(cpuTurn()&&!CH.busy)chessThink();
}
function chessTap(q){if(CH.res||CH.busy||CH.promo)return;if(CH.mode==='cpu'&&CE.turn!==CH.human)return;const p=CE.board[q],c=CE.turn;
  if(CH.sel!=null&&CH.tg&&CH.tg.has(q)){const ms=CH.tg.get(q);if(ms.length>1){CH.promo=ms;pop();return chessShow()}return chessDo(ms[0])}
  if(p&&(p>0)===(c>0)&&CH.sel!==q){CH.sel=q;CH.tg=new Map();for(const m of CE.legal())if(m.f===q){if(!CH.tg.has(m.t))CH.tg.set(m.t,[]);CH.tg.get(m.t).push(m)}pop();return chessShow()}
  CH.sel=null;CH.tg=null;chessShow()}
function chessDo(m){CE.play(m);CH.last={f:m.f,t:m.t};CH.anim={f:m.f,t:m.t};CH.sel=null;CH.tg=null;CH.promo=null;
  const st=CE.status();
  if(st.over){CH.res=st;if(st.type==='mate'){SES.rec[cslot(st.winner)]++;if(CH.mode!=='cpu'||st.winner===CH.human){fanfare();confetti(120)}else buzz()}else ding()}
  else if(st.check)beep(880,.14,'square',.12);else beep(m.cap?240:360,.07,'triangle',.25);
  if(onChess())chessShow()}
function chessWorker(){if(CW)return CW;if(!CWok||typeof Worker==='undefined')return null;
  try{const src=`${CHESS.toString()}\nconst E=CHESS();onmessage=e=>{const d=e.data;E.load(d.fen);const m=E.best(d.level,d.ms);postMessage(m?{f:m.f,t:m.t,pr:m.pr,id:d.id}:{id:d.id})}`;CW=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})))}catch(e){CWok=false;CW=null}return CW}
function chessThink(){const g=CH,id=++g.token,fen=CE.fen(),lv=g.level,ms=lv==='hard'?2000:1200,t0=Date.now();g.busy=true;
  const m0=$('.cmsg');if(m0){m0.textContent=t('thinking');m0.className='cmsg'}const u=$('#cUndo');if(u)u.disabled=true;
  const done=r=>{if(g!==CH||id!==g.token)return;setTimeout(()=>{if(g!==CH||id!==g.token)return;g.busy=false;const m=r&&CE.legal().find(x=>x.f===r.f&&x.t===r.t&&(x.pr||0)===(r.pr||0));if(m)chessDo(m);else if(onChess())chessShow()},Math.max(0,(lv==='hard'?250:600)-(Date.now()-t0)))};
  const runSync=()=>setTimeout(()=>{CEF=CEF||CHESS();CEF.load(fen);const m=CEF.best(lv,ms);done(m&&{f:m.f,t:m.t,pr:m.pr})},60);
  const w=chessWorker();
  if(w){w.onmessage=e=>{if(e.data&&e.data.id===id)done(e.data)};w.onerror=()=>{CWok=false;CW=null;runSync()};try{w.postMessage({fen,level:lv,ms,id})}catch(e){CWok=false;CW=null;runSync()}}
  else runSync()}
function chessUndo(){if(CH.busy||!CE.hist.length)return;if(CH.res&&CH.res.type==='mate'){const k=cslot(CH.res.winner);SES.rec[k]=Math.max(0,SES.rec[k]-1)}
  CH.res=null;CH.promo=null;CH.sel=null;CH.tg=null;
  if(CH.mode==='cpu'){let mine=0;do{const mover=-CE.turn;CE.undo();if(mover===CH.human)mine++}while(CE.hist.length&&(CE.turn!==CH.human||!mine))}else CE.undo();
  const h=CE.hist[CE.hist.length-1];CH.last=h?{f:h.m.f,t:h.m.t}:null;pop();chessShow()}

/* ================= 키보드 ================= */
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='Escape'){if($('#ov').classList.contains('on'))return closeDlg();if(!$('#home').classList.contains('on'))goBack();return}
  if($('#ov').classList.contains('on')||!SES||!$('#play').classList.contains('on'))return;
  if(SES.type==='quiz'){if(e.code==='Space'){e.preventDefault();next()}if(e.key==='h'||e.key==='H'||e.key==='ㅗ')hint()}
  if(SES.type==='cards'){if(e.code==='Space'&&$('#cOk')){e.preventDefault();$('#cOk').click()}if((e.key==='p'||e.key==='P'||e.key==='ㅔ')&&$('#cPass'))$('#cPass').click()}
  if(SES.type==='quiz'||SES.type==='music'){const n=+e.key;if(n>=1&&n<=S.n)addScore(n-1,1)}
});

/* ================= 시작 ================= */
try{if(!history.state)history.replaceState({v:'home',d:0},'')}catch(e){}
route(history.state||{v:'home'});

/* ================= 앱 설치 안내 ================= */
let deferredPrompt=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBar()});
addEventListener('appinstalled',()=>{const b=$('#installBar');if(b)b.classList.remove('on')});
function installBar(){
  let bar=$('#installBar');if(!bar){bar=el('div','');bar.id='installBar';bar.setAttribute('role','dialog');document.body.appendChild(bar)}
  const ua=navigator.userAgent||'';const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  if(standalone||location.protocol==='file:'||store.get('kk_install_x',0)===1||!/github\.io$/.test(location.hostname)&&!/localhost/.test(location.hostname)){bar.classList.remove('on');return}
  const isIOS=/iPhone|iPad|iPod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),isAndroid=/Android/i.test(ua),inApp=/KAKAOTALK|Instagram|FBAN|FBAV|Line\/|NAVER\(inapp|Snapchat|; wv\)/i.test(ua);
  const close=()=>{bar.classList.remove('on');store.set('kk_install_x',1)};
  let title=t('inst'),body='',btns=[];
  if(inApp){title=t('instApp');body=t('instInApp');if(isAndroid)btns.push(`<a class="go" href="intent://${location.host+location.pathname}#Intent;scheme=https;package=com.android.chrome;end">${esc(t('instChrome'))}</a>`)}
  else if(isIOS)body=t('instIOS');
  else if(deferredPrompt){body=t('instAndroid');btns.push(`<button id="ibGo" class="go">${esc(t('instGo'))}</button>`)}
  else if(isAndroid)body=t('instMenu');
  else{bar.classList.remove('on');return}
  bar.innerHTML=`<b>${esc(title)}</b><p>${body}</p><div class="r"><button id="ibX">${esc(deferredPrompt?t('instLater'):t('instOk'))}</button>${btns.join('')}</div>`;
  bar.classList.add('on');$('#ibX').onclick=close;
  const go=$('#ibGo');if(go)go.onclick=async()=>{try{deferredPrompt.prompt();await deferredPrompt.userChoice}catch(e){}deferredPrompt=null;close()};
}
setTimeout(installBar,2500);
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
